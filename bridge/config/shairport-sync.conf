// Shairport Sync configuration for the Campfire Bridge.
// Installed to /etc/shairport-sync.conf by setup-pi.sh.
//
// Output goes to PulseAudio's *default* sink on purpose: the bridge API sets
// the default to campfire_party while party mode is active, so one AirPlay
// stream is distributed to every speaker in sync without shairport-sync
// knowing anything about Bluetooth.

general = {
  name = "Campfire";
  // Let the phone's volume slider control the stream (the app's per-speaker
  // sliders trim each sink on top of this).
  ignore_volume_control = "no";
};

pa = {
  // No sink named here — follow the PulseAudio default (see above).
};
